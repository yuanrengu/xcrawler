[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcrawler"
version = "0.3.0"
description = "X/Twitter user profile analysis toolkit for fetching, translating, analyzing, and reporting public posts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "yuanrengu" }
]
dependencies = [
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "openai>=1.0.0",
  "sentence-transformers>=2.2.0",
  "scikit-learn>=1.3.0",
  "python-dotenv>=1.0.0",
  "huggingface-hub>=0.19.0",
  "transformers>=4.35.0",
  "torch>=2.0.0",
  "langdetect>=1.0.9",
  "matplotlib>=3.7.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/yuanrengu/xcrawler"
Issues = "https://github.com/yuanrengu/xcrawler/issues"

[project.scripts]
xcrawler = "xcrawler.cli:main"

[tool.setuptools]
py-modules = [
  "main",
  "fetch_more_history",
  "analyze_pro",
  "analyze_behavior",
  "translate_sync",
  "analyze_only",
  "visualize",
  "analyze_network",
  "analyze_sentiment",
  "export_csv"
]

[tool.setuptools.packages.find]
include = ["xcrawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
