[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xcrawler-ai"
version = "0.4.1"
description = "X/Twitter user profile analysis toolkit for fetching, translating, analyzing, and reporting public posts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "yuanrengu" }
]
keywords = ["twitter", "x", "social-media", "user-profile", "llm", "analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.31.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "langdetect>=1.0.9"
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.2.0",
  "scikit-learn>=1.3.0",
  "huggingface-hub>=0.19.0",
  "transformers>=4.35.0",
  "torch>=2.0.0"
]
viz = [
  "matplotlib>=3.7.0"
]
all = [
  "sentence-transformers>=2.2.0",
  "scikit-learn>=1.3.0",
  "huggingface-hub>=0.19.0",
  "transformers>=4.35.0",
  "torch>=2.0.0",
  "matplotlib>=3.7.0"
]
test = [
  "pytest>=7.0.0",
  "pytest-cov>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/yuanrengu/xcrawler"
Documentation = "https://github.com/yuanrengu/xcrawler#readme"
Changelog = "https://github.com/yuanrengu/xcrawler/blob/main/CHANGELOG.md"
Issues = "https://github.com/yuanrengu/xcrawler/issues"
Source = "https://github.com/yuanrengu/xcrawler"

[project.scripts]
xcrawler = "xcrawler.cli:main"

[tool.setuptools]
py-modules = [
  "main",
  "fetch_more_history",
  "analyze_pro",
  "analyze_behavior",
  "translate_sync",
  "analyze_only",
  "visualize",
  "analyze_network",
  "analyze_sentiment",
  "export_csv"
]

[tool.setuptools.packages.find]
include = ["xcrawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["cache/", "cache_backup/", "__pycache__/", ".git/"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["cache", "cache_backup", "__pycache__", ".git", "xcrawler.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402", "E731", "E741", "F401"]
