    <text x="542" y="434" fill="#475569" text-anchor="end">0.78</text>
    <text x="122" y="480" fill="#334155">Product research</text>
    <rect x="250" y="464" width="280" height="18" rx="9" fill="#ffedd5"/>
    <rect x="250" y="464" width="190" height="18" rx="9" fill="#ea580c"/>
    <text x="542" y="480" fill="#475569" text-anchor="end">0.68</text>
    <text x="122" y="526" fill="#334155">Content strategy</text>
    <rect x="250" y="510" width="280" height="18" rx="9" fill="#f3e8ff"/>
    <rect x="250" y="510" width="165" height="18" rx="9" fill="#9333ea"/>
    <text x="542" y="526" fill="#475569" text-anchor="end">0.59</text>
  </g>

  <rect x="624" y="304" width="484" height="270" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="654" y="342" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#0f172a">24h activity heatmap</text>
  <g transform="translate(654 382)">
    <rect width="392" height="122" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <g fill="#bfdbfe">
      <rect x="18" y="70" width="18" height="34" rx="4"/>
      <rect x="46" y="82" width="18" height="22" rx="4"/>
      <rect x="74" y="56" width="18" height="48" rx="4"/>
      <rect x="102" y="36" width="18" height="68" rx="4"/>
      <rect x="130" y="48" width="18" height="56" rx="4"/>
      <rect x="158" y="24" width="18" height="80" rx="4"/>
      <rect x="186" y="62" width="18" height="42" rx="4"/>
      <rect x="214" y="20" width="18" height="84" rx="4"/>
      <rect x="242" y="44" width="18" height="60" rx="4"/>
      <rect x="270" y="58" width="18" height="46" rx="4"/>
      <rect x="298" y="32" width="18" height="72" rx="4"/>
      <rect x="326" y="78" width="18" height="26" rx="4"/>
      <rect x="354" y="88" width="18" height="16" rx="4"/>
    </g>
    <rect x="214" y="20" width="18" height="84" rx="4" fill="#2563eb"/>
  </g>
  <text x="654" y="548" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Generated from public posts, translated records, and validated evidence IDs.</text>

  <rect x="92" y="598" width="1016" height="4" rx="2" fill="url(#accent)"/>
</svg>
