<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">xcrawler report preview</title>
  <desc id="desc">A preview of an evidence-backed X timeline analysis report generated by xcrawler.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <rect x="56" y="48" width="1088" height="584" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="56" y="48" width="1088" height="70" rx="18" fill="#0f172a"/>
  <circle cx="92" cy="83" r="7" fill="#ef4444"/>
  <circle cx="116" cy="83" r="7" fill="#f59e0b"/>
  <circle cx="140" cy="83" r="7" fill="#22c55e"/>
  <text x="180" y="89" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">xcrawler public timeline report</text>
  <text x="918" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#cbd5e1">evidence-backed analysis</text>

  <rect x="92" y="150" width="280" height="112" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="118" y="187" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#047857">Interest profile</text>
  <text x="118" y="225" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#064e3b">7 tags</text>
  <text x="244" y="224" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#047857">tweet_id evidence</text>

  <rect x="404" y="150" width="280" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="430" y="187" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Behavior pattern</text>
  <text x="430" y="225" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#1e3a8a">UTC+8</text>
  <text x="576" y="224" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1d4ed8">local timeline</text>

  <rect x="716" y="150" width="392" height="112" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="742" y="187" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#c2410c">Privacy defaults</text>
  <text x="742" y="225" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#7c2d12">redacted</text>
  <text x="928" y="224" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#c2410c">sensitive events hidden</text>

