<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">xcrawler social preview</title>
  <desc id="desc">xcrawler turns public X timelines into evidence-backed profiles, behavior insights, sentiment trends, and reports.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0f2f38"/>
      <stop offset="1" stop-color="#113f67"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#canvas)"/>
  <path d="M0 520 C 240 452, 350 620, 610 532 S 1040 418, 1280 506 L 1280 640 L 0 640 Z" fill="#0f172a" opacity="0.36"/>
  <circle cx="1130" cy="110" r="110" fill="#38bdf8" opacity="0.10"/>
  <circle cx="105" cy="545" r="145" fill="#34d399" opacity="0.10"/>

  <g transform="translate(92 92)">
    <rect x="0" y="0" width="510" height="456" rx="28" fill="#ffffff" opacity="0.96" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="510" height="64" rx="28" fill="#111827"/>
    <circle cx="36" cy="32" r="7" fill="#ef4444"/>
    <circle cx="60" cy="32" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="7" fill="#22c55e"/>
    <text x="116" y="39" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#f8fafc">report.html</text>
    <text x="34" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#0f172a">Evidence-backed profile</text>
    <rect x="34" y="140" width="170" height="64" rx="16" fill="#ecfdf5"/>
    <text x="58" y="180" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#047857">7 tags</text>
    <rect x="226" y="140" width="248" height="64" rx="16" fill="#eff6ff"/>
    <text x="250" y="180" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#1d4ed8">tweet_id proof</text>
    <rect x="34" y="244" width="440" height="18" rx="9" fill="#dbeafe"/>
    <rect x="34" y="244" width="338" height="18" rx="9" fill="#2563eb"/>
    <rect x="34" y="296" width="440" height="18" rx="9" fill="#dcfce7"/>
    <rect x="34" y="296" width="292" height="18" rx="9" fill="#10b981"/>
    <rect x="34" y="348" width="440" height="18" rx="9" fill="#fef3c7"/>
    <rect x="34" y="348" width="236" height="18" rx="9" fill="#f59e0b"/>
    <text x="34" y="420" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#475569">public timelines / multilingual translation / privacy defaults</text>
  </g>

  <g transform="translate(680 104)">
    <text x="0" y="76" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="900" fill="#f8fafc">xcrawler</text>
    <rect x="4" y="100" width="420" height="7" rx="4" fill="url(#line)"/>
    <text x="0" y="160" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#dbeafe">Analyze public X/Twitter timelines</text>
    <text x="0" y="212" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#cbd5e1">Fetch, translate, cluster, and report</text>
    <text x="0" y="252" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#cbd5e1">with evidence IDs and privacy-safe defaults.</text>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
      <rect x="0" y="304" width="132" height="42" rx="21" fill="#ecfdf5"/>
      <text x="66" y="332" text-anchor="middle" fill="#047857">Python CLI</text>
      <rect x="152" y="304" width="170" height="42" rx="21" fill="#eff6ff"/>
      <text x="237" y="332" text-anchor="middle" fill="#1d4ed8">LLM analysis</text>
      <rect x="342" y="304" width="150" height="42" rx="21" fill="#f5f3ff"/>
      <text x="417" y="332" text-anchor="middle" fill="#6d28d9">HTML reports</text>
    </g>
    <text x="0" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#bfdbfe">$ xcrawler fetch --user creator</text>
  </g>
</svg>
